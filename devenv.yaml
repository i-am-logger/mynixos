# devenv's nixpkgs is the flake's: one pin, held in flake.lock, so the dev
# shell and the systems agree on every package (N11). devenv.lock records a
# copy of the flake's lock graph and follows it on the next `devenv shell`.
inputs:
  mynixos:
    url: path:.
  nixpkgs:
    follows: mynixos/nixpkgs
